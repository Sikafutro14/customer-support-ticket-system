<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SupportDesk{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>

    {% block extra_css %}
    {% endblock %}
</head>

<body>

<nav>

    <div class="logo">
        🎧 SupportDesk
    </div>

    <div>
        <a href="/">Submit Ticket</a>
        <a href="/tickets/">Dashboard</a>
        <a href="/admin/">Admin</a>
    </div>

</nav>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
