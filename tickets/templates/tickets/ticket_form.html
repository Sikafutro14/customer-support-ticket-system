<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support</title>
</head>

<body>
    {% extends "tickets/base.html" %}

    {% block title %}
    Submit Ticket | SupportDesk
    {% endblock %}
    
    {% block extra_css %}
    <style>
    
        .form-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }
    
        .form-container h1 {
            margin-bottom: 10px;
        }
    
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
    
        form p {
            margin-bottom: 20px;
        }
    
        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }
    
        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }
    
        form textarea {
            min-height: 130px;
        }
    
    </style>
    {% endblock %}
    
    
    {% block content %}
    
    <div class="form-container">
    
        <h1>How can we help?</h1>
    
        <p class="subtitle">
            Submit a support request and our team will review your issue.
        </p>
    
        <form method="POST">
    
            {% csrf_token %}
    
            {{ form.as_p }}
    
            <button class="btn" type="submit">
                Submit Ticket
            </button>
    
        </form>
    
    </div>
    
    {% endblock %}
</body>
</html>
